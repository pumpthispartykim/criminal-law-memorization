<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>형사법 암기</title>
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache">
<style>
/* Shell: each app runs untouched in its own full-screen iframe, so their CSS, scripts
   and hash routing never collide. Switching is done from the ▾ dropdown next to each
   app's title (shared/switcher.js), which posts a message here. Both iframes stay
   alive once opened, so switching back keeps your place. */
:root{--bg:#f6f7f9;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;color-scheme:dark}}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
</style>
</head>
<body>
<iframe id="pane-trial" title="형사재판실무" data-src="trial/index.html?v=20261125g" hidden></iframe>
<iframe id="pane-prosecution" title="검찰실무" data-src="prosecution/index.html?v=20261125g" hidden></iframe>
<script>
(function(){
  var KEY='hub-tab', TITLES={trial:'형사재판실무',prosecution:'검찰실무'};
  function store(k){try{localStorage.setItem(KEY,k)}catch(e){}}
  function stored(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function show(k){
    if(!TITLES[k])k='trial';
    Object.keys(TITLES).forEach(function(key){
      var f=document.getElementById('pane-'+key), on=key===k;
      f.hidden=!on;
      if(on&&!f.getAttribute('src'))f.src=f.dataset.src; // load each app on first open only
    });
    var f=document.getElementById('pane-'+k);
    try{f.contentWindow.focus()}catch(e){}
    document.title=TITLES[k]+' · 형사법 암기';
    store(k);
    if(location.hash!=='#'+k)history.replaceState(null,'','#'+k);
  }
  window.addEventListener('message',function(e){
    var src=[].some.call(document.querySelectorAll('iframe'),function(f){return f.contentWindow===e.source});
    if(!src||!e.data||e.data.type!=='subject-switch')return; // only our own panes may switch
    show(e.data.to);
  });
  window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
  show(location.hash.slice(1)||stored()||'trial');
})();
</script>
</body>
</html>
